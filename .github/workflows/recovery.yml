name: SSH Recovery
on: workflow_dispatch

jobs:
  recover:
    runs-on: self-hosted
    steps:
      - name: Restore SSH access via docker chroot
        run: |
          docker run --rm -v /:/host alpine chroot /host /bin/sh -c '
            mkdir -p /root/.ssh
            echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIB0JRViSHJY2PE2y4EtiEIjh7LG0LVeWM2LW0hWx3ZuO recovery-2026-11-06" >> /root/.ssh/authorized_keys
            chmod 700 /root/.ssh
            chmod 600 /root/.ssh/authorized_keys
          '
      - name: Confirm
        run: docker run --rm -v /:/host alpine chroot /host cat /root/.ssh/authorized_keys

      - name: List users
        run: |
          docker run --rm -v /:/host alpine chroot /host /bin/sh -c '
            echo "--- Users with login shell / home dir ---"
            grep -vE "nologin|false" /etc/passwd
            echo "--- All users uid>=1000 (human accounts) ---"
            awk -F: "\$3>=1000{print}" /etc/passwd
          '

      - name: Restart sshd via host PID namespace
        run: |
          docker run --rm --privileged --pid=host alpine nsenter -t 1 -m -u -n -i \
            systemctl restart ssh

      - name: Allow root login via key and restart sshd
        run: |
          docker run --rm -v /:/host alpine chroot /host /bin/sh -c '
            sed -i "s/^PermitRootLogin no/PermitRootLogin prohibit-password/" /etc/ssh/sshd_config
            grep -i "^PermitRootLogin" /etc/ssh/sshd_config
          '
          # chroot не бачить systemd/dbus (помилка "Failed to connect to system scope bus"
          # у попередньому логу) — тому не можна restart sshd зсередини chroot.
          # Перезапускаємо службу напряму на хості:
          sudo systemctl restart ssh || sudo systemctl restart sshd

      - name: Diagnose sshd
        run: |
          docker run --rm -v /:/host alpine chroot /host /bin/sh -c '
            echo "--- /root/.ssh permissions ---"
            ls -la /root/.ssh
            stat /root/.ssh/authorized_keys
            echo "--- sshd_config ---"
            grep -iE "PermitRootLogin|PubkeyAuthentication|AuthorizedKeysFile|AuthorizedKeysCommand" /etc/ssh/sshd_config
            echo "--- sshd_config.d drop-ins ---"
            for f in /etc/ssh/sshd_config.d/*.conf; do
              echo "== $f =="
              cat "$f"
            done
            echo "--- sshd service status ---"
            systemctl is-active ssh sshd 2>&1
          '
      