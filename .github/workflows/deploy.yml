name: Deploy

on:
  push:
    branches: [production]
  pull_request:
    branches: [production]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - auth
          - user-profile
          - spellbook
          - skill-tree
          - character-sheet
          - dice-roller
          - equipment
          - abilities
          - campaigns
          - bestiary
          - npcs
          - admin
          - media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: services/${{ matrix.service }}
        run: npm ci
      - working-directory: services/${{ matrix.service }}
        run: npm test

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - working-directory: services/frontend
        run: npm ci
      - working-directory: services/frontend
        run: npm run build

  # Only real pushes to production (i.e. a merged PR) reach here — pull_request
  # runs are gated by the two jobs above but never deploy unmerged code.
  deploy:
    if: github.event_name == 'push'
    needs: [test-backend, build-frontend]
    runs-on: self-hosted
    steps:
      - name: Pull latest production and redeploy
        run: |
          set -euo pipefail
          cd /opt/walp-tabletop
          git fetch origin production
          git reset --hard origin/production
          # BuildKit resolves base-image metadata (node:20-alpine) against
          # Docker Hub on every build, even when the image is cached, so a
          # transient registry/TLS timeout fails the whole deploy — retry the
          # build a few times before giving up. Running containers are left
          # untouched until the build succeeds.
          for attempt in 1 2 3; do
            if docker compose -f docker-compose.prod.yml build; then break; fi
            if [ "$attempt" -eq 3 ]; then echo "Build failed after 3 attempts" >&2; exit 1; fi
            echo "Build attempt $attempt failed, retrying in 20s..." >&2
            sleep 20
          done
          docker compose -f docker-compose.prod.yml up -d
          # nginx.prod.conf is bind-mounted, so "up -d" alone won't reload it
          # or re-resolve backend container IPs if only the file content
          # changed (compose only recreates containers on service-spec
          # changes) — restart it every deploy to guarantee both.
          docker compose -f docker-compose.prod.yml restart nginx
          bash database/migrate.sh
